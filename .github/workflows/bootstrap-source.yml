name: Bootstrap v8.31 source

on:
  push:
    branches:
      - main
    paths:
      - '.source_parts/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .source_parts/part-* > /tmp/faculty-scheduler-source.b64
          base64 --decode /tmp/faculty-scheduler-source.b64 > /tmp/faculty-scheduler-source.zip
          unzip -o /tmp/faculty-scheduler-source.zip -d .
          rm -rf .source_parts

      - name: Commit v8.31 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Faculty Schedule Tool v8.31 source and documentation"
          git push
